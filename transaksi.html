<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Detail Transaksi Kas DKM</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header-donasi"><div class="container text-center"><img src="img/logo.png" class="logo-masjid mb-2" alt="Logo DKM"><h1 class="judul-donasi">DETAIL TRANSAKSI KAS DKM</h1><p class="subjudul mb-2">Musholla Nurul Huda Pondok Dewata</p><a href="index.html" class="btn btn-light btn-sm">← Kembali ke Dashboard</a></div></header>
<main class="container py-4">
 <section class="card card-donasi mb-4"><div class="card-body"><div class="row g-3 align-items-end">
  <div class="col-md-3"><label class="form-label fw-bold">Jenis</label><select id="jenis" class="form-select"><option value="">Semua</option><option value="MASUK">Kas Masuk</option><option value="KELUAR">Kas Keluar</option></select></div>
  <div class="col-md-3"><label class="form-label fw-bold">Kategori</label><input id="kategori" class="form-control" placeholder="Contoh: INFAQ"></div>
  <div class="col-md-3"><label class="form-label fw-bold">Dari Tanggal</label><input id="mulai" type="date" class="form-control"></div>
  <div class="col-md-3"><label class="form-label fw-bold">Sampai Tanggal</label><input id="akhir" type="date" class="form-control"></div>
  <div class="col-12"><button id="btnCari" class="btn btn-primary">Tampilkan</button> <button id="btnReset" class="btn btn-secondary">Reset</button></div>
 </div></div></section>
 <section class="row g-3 mb-3"><div class="col-md-4"><div class="mini-stat">Total Masuk <strong id="totalMasuk">Rp0</strong></div></div><div class="col-md-4"><div class="mini-stat">Total Keluar <strong id="totalKeluar">Rp0</strong></div></div><div class="col-md-4"><div class="mini-stat">Transaksi <strong id="jumlah">0</strong></div></div></section>
 <section class="card card-donasi"><div class="card-header d-flex justify-content-between"><h5 class="mb-0">Daftar Transaksi</h5><span id="infoPage" class="small text-muted"></span></div><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th>No</th><th>Tanggal</th><th>Jenis</th><th>Kategori</th><th>Keterangan</th><th>Petugas</th><th class="text-end">Nominal</th></tr></thead><tbody id="tbody"><tr><td colspan="7" class="text-center py-4">Memuat...</td></tr></tbody></table></div><div class="card-footer d-flex justify-content-between align-items-center"><button id="prev" class="btn btn-outline-primary btn-sm">← Sebelumnya</button><span id="pager">Halaman 1</span><button id="next" class="btn btn-outline-primary btn-sm">Berikutnya →</button></div></section>
</main>
<script src="js/config.js"></script><script src="js/transaksi.js"></script>
</body></html>
