<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Detail Transaksi - Kas DKM</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar"></div>
<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <div>
      <div class="eyebrow">DETAIL TRANSAKSI</div>
      <h1 class="page-title">Kas DKM</h1>
      <div class="text-muted">Seluruh transaksi dengan filter dan pagination.</div>
    </div>
    <a href="index.html" class="btn btn-outline-success">← Dashboard</a>
  </div>

  <section class="section-card mb-4">
    <div class="section-title green">Filter Transaksi</div>
    <div class="p-3">
      <div class="row g-3">
        <div class="col-md-3">
          <label class="form-label">Jenis</label>
          <select id="filterJenis" class="form-select">
            <option value="">Semua Jenis</option>
            <option value="MASUK">Kas Masuk</option>
            <option value="KELUAR">Kas Keluar</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Kategori</label>
          <select id="filterKategori" class="form-select">
            <option value="">Semua Kategori</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Dari Tanggal</label>
          <input id="filterMulai" type="date" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label">Sampai Tanggal</label>
          <input id="filterAkhir" type="date" class="form-control">
        </div>
      </div>
      <div class="mt-3 d-flex gap-2 flex-wrap">
        <button id="btnFilter" class="btn btn-success">Tampilkan</button>
        <button id="btnReset" class="btn btn-outline-secondary">Reset</button>
      </div>
    </div>
  </section>

  <section class="row g-3 mb-4">
    <div class="col-md-4"><div class="card summary-small"><small>TRANSAKSI</small><strong id="totalTransaksi">0</strong></div></div>
    <div class="col-md-4"><div class="card summary-small"><small>TOTAL MASUK</small><strong id="detailMasuk">Rp 0</strong></div></div>
    <div class="col-md-4"><div class="card summary-small"><small>TOTAL KELUAR</small><strong id="detailKeluar">Rp 0</strong></div></div>
  </section>

  <section class="section-card">
    <div class="section-head"><h2>Daftar Transaksi</h2><span id="infoPage"></span></div>
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead><tr><th>No</th><th>Tanggal</th><th>Jenis</th><th>Kategori</th><th>Keterangan</th><th>Petugas</th><th class="text-end">Nominal</th></tr></thead>
        <tbody id="tbodyTransaksi"><tr><td colspan="7" class="empty">Memuat data...</td></tr></tbody>
      </table>
    </div>
    <div class="pagination-box">
      <button id="btnPrev" class="btn btn-outline-success">← Sebelumnya</button>
      <span id="pageInfo" class="fw-semibold">Halaman 1</span>
      <button id="btnNext" class="btn btn-outline-success">Berikutnya →</button>
    </div>
  </section>
</main>
<div id="loadingOverlay"><div class="spinner-border text-success"></div><div class="mt-2">Memuat data...</div></div>
<script src="js/config.js"></script>
<script src="js/transaksi.js"></script>
</body>
</html>
